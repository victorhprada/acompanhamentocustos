name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Backend Tests ───────────────────────────────────────
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      # Verifica que a app sobe (imports, Settings, rotas). Placeholders bastam:
      # o cliente Supabase so e criado por request, nunca no boot.
      - name: Boot check (uvicorn + /health)
        working-directory: backend
        env:
          SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_ANON_KEY: placeholder
          SUPABASE_SERVICE_ROLE_KEY: placeholder
          SECRET_KEY: ci-boot-check
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/uvicorn.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/health && exit 0
            sleep 1
          done
          cat /tmp/uvicorn.log
          echo "::error::Backend nao subiu em 30s"
          exit 1

      # A suite behave e de aceitacao: precisa de um ambiente de TESTE completo
      # (backend no ar + projeto Supabase de teste com admin/analyst/viewer@test.com
      # e migrations aplicadas). NUNCA apontar para producao — a suite escreve dados.
      # Para habilitar: variable SPECS_API_BASE_URL + secrets SPECS_SUPABASE_URL,
      # SPECS_SUPABASE_ANON_KEY, SPECS_SUPABASE_SERVICE_ROLE_KEY e SPECS_DATABASE_URL
      # (pooler do projeto Supabase de teste).
      - name: Run specs (behave)
        if: ${{ vars.SPECS_API_BASE_URL != '' }}
        env:
          API_BASE_URL: ${{ vars.SPECS_API_BASE_URL }}
          SUPABASE_URL: ${{ secrets.SPECS_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SPECS_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SPECS_SUPABASE_SERVICE_ROLE_KEY }}
          DATABASE_URL: ${{ secrets.SPECS_DATABASE_URL }}
        run: behave specs/ --stop

      - name: Specs skipped (ambiente de teste nao configurado)
        if: ${{ vars.SPECS_API_BASE_URL == '' }}
        run: |
          echo "Specs de aceitacao puladas: defina a variable SPECS_API_BASE_URL"
          echo "e os secrets SPECS_* apontando para o ambiente de teste."

  # ── Frontend Build ──────────────────────────────────────
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check & build
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: http://localhost:8000/api/v1
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7
